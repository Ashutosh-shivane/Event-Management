<!DOCTYPE html>
<html lang="en" style="font-family: Arial, sans-serif;">
<body style="background: #f4f4f7; padding: 20px;">
<table width="100%" cellspacing="0" cellpadding="0">
  <tr>
    <td align="center">
      <table width="600" style="background: #ffffff; border-radius: 8px; padding: 20px;">

        <tr>
          <td style="text-align: center;">
            <h2 style="color: #4a90e2;">Event Management System</h2>
            <p style="color: #555; font-size: 15px;">
              Hi <b>{{username}}</b>,<br>
              Your email verification OTP code is:
            </p>

            <div style="background: #4a90e2; color: white;
                  display: inline-block; padding: 12px 24px;
                  border-radius: 5px; font-size: 22px; letter-spacing: 4px;">
              {{otp}}
            </div>

            <p style="margin-top: 20px; color: #555; font-size: 14px;">
              This OTP is valid for <b>10 minutes</b>. Do not share it with anyone.
            </p>

            <hr style="margin: 20px 0; border: none; height: 1px; background: #ddd;">

            <p style="color: #777; font-size: 13px;">
              If you didn't request this, you can ignore this email.
            </p>

            <p style="color: #4a90e2; font-size: 13px;">
              © 2025 Event Management | All rights reserved.
            </p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
</body>
</html>
